{# Частичный шаблон для обновления карточки подсказки #}
<div class="suggestion-card" role="status" aria-live="polite">
    {% if word.state == 'added' %}
        <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-success-strong);">
            <i data-lucide="check-circle" style="width: 18px; height: 18px;" aria-hidden="true"></i>
            <strong>{{ word.lemma }}</strong> — {{ word.translation }} (добавлено)
        </div>
    {% elif word.state == 'ignored' %}
        <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted);">
            <i data-lucide="x-circle" style="width: 18px; height: 18px;" aria-hidden="true"></i>
            <s>{{ word.lemma }}</s> — <s>{{ word.translation }}</s> (пропущено)
        </div>
    {% endif %}
</div>
