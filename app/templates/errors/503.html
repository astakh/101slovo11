{% extends "base.html" %}
{% block title %}503 Сервис недоступен{% endblock %}
{% block content %}
<div style="text-align: center; margin-top: 4rem;">
    <h1>503</h1>
    <p>Сервис генерации временно недоступен.</p>

</div>
{% endblock %}
