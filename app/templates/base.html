<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>{% block title %}101slovo{% endblock %}</title>

    <!-- Инициализация темы до рендера (предотвращает FOUC) -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- Preload шрифтов (критично для скорости!) -->
    <link rel="preload" href="/static/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/inter-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Локальный CSS (water.css удалён — всё перекрыто custom.css) -->
    <link rel="stylesheet" href="/static/css/custom.css">

    <!-- Локальные JS библиотеки -->
    <script src="/static/vendor/htmx.min.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
    <script defer src="/static/vendor/lucide.min.js"></script>

    {% block head %}{% endblock %}
</head>
<body>
    {% include "partials/nav.html" %}
    {% include "partials/flash.html" %}
    
    <main class="container fade-in-up" style="padding-top: 2rem; padding-bottom: 4rem;">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="container text-center" style="padding: 2rem 0; color: var(--text-muted); font-size: 0.875rem; border-top: 1px solid var(--border-light); margin-top: auto;">
        <p>© 2026 101slovo • Учи английский умнее с ИИ</p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
        document.body.addEventListener('htmx:afterSwap', () => { if (window.lucide) lucide.createIcons(); });
        
        // Глобальный Alpine store для модалок
        document.addEventListener('alpine:init', () => {
            Alpine.store('addWordModal', {
                isOpen: false,
                open() { this.isOpen = true; },
                close() { this.isOpen = false; }
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
