{% extends "base.html" %}
{% block title %}Вход — 101slovo{% endblock %}
{% block content %}
<div class="container--narrow" style="margin: 4rem auto;">
    <div class="card" style="max-width: 440px; margin: 0 auto; padding: 2.5rem;">
        <div class="text-center mb-4">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">👋</div>
            <h2 style="margin: 0;">С возвращением!</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Войдите, чтобы продолжить обучение</p>
        </div>
        
        {% if error %}
            <div class="flash-error">
                <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div style="margin-bottom: 1rem;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email|default('') }}" required placeholder="you@example.com">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" style="width: 100%; padding: 0.875rem;">Войти</button>
        </form>
        
        <p class="text-center mt-4" style="color: var(--text-muted); font-size: 0.925rem;">
            Нет аккаунта? <a href="/register" style="font-weight: 600;">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
