{% extends "base.html" %}
{% block title %}Вход — 101slovo{% endblock %}
{% block content %}
<div class="container--narrow" style="margin: 1.5rem auto;">
  <div class="card card--auth">
    <div class="page-header">
      <div class="page-header__emoji">👋</div>
      <h2 style="margin: 0;">С возвращением!</h2>
      <p class="page-header__subtitle">Войдите, чтобы продолжить обучение</p>
    </div>

    {% if error %}
    <div class="flash-error">
      <i data-lucide="alert-circle" class="icon-md" aria-hidden="true"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" required placeholder="you@example.com">
      </div>
      <div class="form-group--last">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" style="width: 100%; padding: 0.75rem;">Войти</button>
    </form>

    <p class="text-center mt-3" style="color: var(--text-muted); font-size: 0.875rem;">
      Нет аккаунта? <a href="/register" style="font-weight: 600;">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
