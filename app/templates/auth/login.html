{% extends "base.html" %}
{% block title %}Вход — 101slovo{% endblock %}
{% block content %}
<div class="container--narrow" style="margin: 1.5rem auto;">
  <div class="card" style="max-width: 440px; margin: 0 auto; padding: 1.5rem;">
    <div class="text-center mb-3">
      <div style="font-size: 2.25rem; margin-bottom: 0.375rem;">👋</div>
      <h2 style="margin: 0;">С возвращением!</h2>
      <p style="color: var(--text-muted); margin-top: 0.375rem;">Войдите, чтобы продолжить обучение</p>
    </div>

    {% if error %}
    <div class="flash-error">
      <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div style="margin-bottom: 0.875rem;">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" required placeholder="you@example.com">
      </div>
      <div style="margin-bottom: 1.25rem;">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" style="width: 100%; padding: 0.75rem;">Войти</button>
    </form>

    <p class="text-center mt-3" style="color: var(--text-muted); font-size: 0.875rem;">
      Нет аккаунта? <a href="/register" style="font-weight: 600;">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
