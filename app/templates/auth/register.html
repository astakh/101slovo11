{% extends "base.html" %}
{% block title %}Регистрация — 101slovo{% endblock %}
{% block content %}
<div class="container--narrow" style="margin: 4rem auto;">
    <div class="card" style="max-width: 440px; margin: 0 auto; padding: 2.5rem;">
        <div class="text-center mb-4">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🚀</div>
            <h2 style="margin: 0;">Создать аккаунт</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Начните учить английский уже сегодня</p>
        </div>
        
        {% if error %}
            <div class="flash-error">
                <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="/register">
            <div style="margin-bottom: 1rem;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email|default('') }}" required placeholder="you@example.com">
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="password">Пароль (мин. 8 символов)</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="72" required placeholder="••••••••">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label for="password_confirm">Повторите пароль</label>
                <input type="password" id="password_confirm" name="password_confirm" minlength="8" maxlength="72" required placeholder="••••••••">
            </div>
            <button type="submit" style="width: 100%; padding: 0.875rem;">Создать аккаунт</button>
        </form>
        
        <p class="text-center mt-4" style="color: var(--text-muted); font-size: 0.925rem;">
            Уже есть аккаунт? <a href="/login" style="font-weight: 600;">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
