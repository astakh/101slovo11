{% if request.state.flashes %}
<div class="container" style="margin-top: 1.5rem;" aria-live="polite" aria-atomic="true">
  {% for flash in request.state.flashes %}
  <div class="flash-{{ flash.category }}" role="alert">
    {% if flash.category == 'success' %}
    <i data-lucide="check-circle" class="icon-xl" style="flex-shrink: 0;" aria-hidden="true"></i>
    {% elif flash.category == 'error' %}
    <i data-lucide="alert-circle" class="icon-xl" style="flex-shrink: 0;" aria-hidden="true"></i>
    {% elif flash.category == 'info' %}
    <i data-lucide="info" class="icon-xl" style="flex-shrink: 0;" aria-hidden="true"></i>
    {% elif flash.category == 'warning' %}
    <i data-lucide="alert-triangle" class="icon-xl" style="flex-shrink: 0;" aria-hidden="true"></i>
    {% endif %}
    <span>{{ flash.message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
